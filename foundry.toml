[profile.default]
src = "contracts"
out = "out"
libs = []
test = "contracts/test"
solc_version = "0.8.26"
optimizer = false
# No forge-std, so no dependency tree to fetch. The tests are plain
# require-based checks on committed vectors, which needs no cheatcodes.
ffi = false
fs_permissions = []

[fmt]
line_length = 110
tab_width = 4
